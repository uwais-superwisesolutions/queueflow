<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>QueueFlow — Prototype</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ---------- Design tokens (light) ---------- */
    :root {
      --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;

      /* warm-toned neutrals (oklch, low chroma, hue ~70-80) */
      --bg:        #faf8f3;   /* page background */
      --surface:   #ffffff;   /* card surface */
      --surface-2: #f5f2eb;   /* subtle inset */
      --surface-3: #ede9df;   /* hover / divider fill */
      --line:      #e6e1d4;   /* borders */
      --line-2:    #d9d3c2;   /* stronger border */
      --ink:       #1d1c18;   /* primary text */
      --ink-2:     #44423b;   /* secondary text */
      --ink-3:     #6e6b60;   /* muted text */
      --ink-4:     #948f81;   /* placeholder / hint */

      /* brand */
      --teal:      #0f6e56;   /* primary brand */
      --teal-2:    #0a4f3e;   /* hover */
      --teal-tint: #e3efe9;   /* tinted bg */
      --teal-ink:  #084a39;   /* on-tint text */

      /* states */
      --coral:     #d85a30;
      --coral-2:   #b94621;
      --coral-tint:#fbeae0;
      --amber:     #b6791f;
      --amber-tint:#f7ecd2;
      --blue:      #2a6fcc;
      --blue-tint: #e0ebf8;
      --success:   #1f8a5b;
      --success-tint: #e0f0e5;

      /* radii */
      --r-sm: 6px;
      --r-md: 10px;
      --r-lg: 14px;
      --r-xl: 20px;

      /* shadows */
      --shadow-sm: 0 1px 0 rgba(20,18,12,.04), 0 1px 2px rgba(20,18,12,.04);
      --shadow-md: 0 1px 0 rgba(20,18,12,.05), 0 4px 12px rgba(20,18,12,.05);
      --shadow-lg: 0 12px 32px rgba(20,18,12,.10);
    }

    /* ---------- Design tokens (dark, scoped to .qf-dark) ---------- */
    .qf-dark {
      --bg:        #16181a;
      --surface:   #1d2022;
      --surface-2: #24272a;
      --surface-3: #2c3034;
      --line:      #2e3236;
      --line-2:    #3a3f44;
      --ink:       #ecead9;
      --ink-2:     #c7c5b6;
      --ink-3:     #8f8d80;
      --ink-4:     #6a685e;

      --teal:      #2ea886;
      --teal-2:    #43c19c;
      --teal-tint: #1c2f29;
      --teal-ink:  #8ad9bd;

      --coral:     #e8784f;
      --coral-tint:#3a221a;
      --amber:     #d6a44d;
      --amber-tint:#352c1a;
      --blue:      #5b91dd;
      --blue-tint: #1b2738;
      --success:   #43b888;
      --success-tint: #1c2f29;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.45;
      font-feature-settings: "ss01", "cv11";
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.005em;
    }

    /* ---------- Small utility classes used across screens ---------- */
    .mono { font-family: var(--font-mono); letter-spacing: -0.01em; }
    .tnum { font-variant-numeric: tabular-nums; }

    .qf-scroll::-webkit-scrollbar { width: 10px; height: 10px; }
    .qf-scroll::-webkit-scrollbar-thumb {
      background: var(--line-2); border-radius: 5px;
      border: 2px solid var(--bg); background-clip: content-box;
    }
    .qf-scroll::-webkit-scrollbar-thumb:hover { background-color: var(--ink-4); background-clip: content-box; }
    .qf-scroll::-webkit-scrollbar-track { background: transparent; }

    /* pulsing live dot */
    @keyframes qf-pulse {
      0%   { box-shadow: 0 0 0 0 currentColor; opacity: 1; }
      70%  { box-shadow: 0 0 0 6px transparent; opacity: 1; }
      100% { box-shadow: 0 0 0 0 transparent; opacity: 1; }
    }
    .qf-live-dot {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--success);
      color: rgba(31,138,91,.35);
      animation: qf-pulse 2s ease-out infinite;
    }
    .qf-live-dot.coral { background: var(--coral); color: rgba(216,90,48,.35); }
    .qf-live-dot.amber { background: var(--amber); color: rgba(182,121,31,.35); }

    /* generic button reset */
    button { font: inherit; color: inherit; }

    /* placeholder image surface — subtle stripes */
    .qf-placeholder {
      background:
        repeating-linear-gradient(135deg, transparent 0 10px, rgba(20,18,12,.04) 10px 11px),
        var(--surface-2);
      color: var(--ink-4);
      font-family: var(--font-mono);
      font-size: 11px;
      display: flex; align-items: center; justify-content: center;
      border: 1px dashed var(--line-2);
      border-radius: var(--r-md);
    }

    /* ─────── App chrome (persona switcher + screen tabs) ─────── */
    .qf-chrome {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      backdrop-filter: blur(12px) saturate(140%);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      background: color-mix(in oklab, var(--bg) 80%, transparent);
      border-bottom: 1px solid var(--line);
      height: 48px;
      display: flex; align-items: center;
      padding: 0 16px;
      gap: 16px;
    }
    .qf-stage {
      padding-top: 48px;
      min-height: 100vh;
    }

    /* No focus rings on mouse, but keep for keyboard */
    :focus { outline: none; }
    :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; border-radius: 4px; }
  </style>

  <script type="application/json" id="speaker-notes">[]</script>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel (pinned) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Tweaks shell -->
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <!-- Shared UI primitives -->
  <script type="text/babel" src="ui.jsx"></script>

  <!-- Screen modules (each Object.assigns into window) -->
  <script type="text/babel" src="screens-marketing.jsx"></script>
  <script type="text/babel" src="screens-onboarding.jsx"></script>
  <script type="text/babel" src="screens-superuser-mgmt.jsx"></script>
  <script type="text/babel" src="screens-superuser.jsx"></script>
  <script type="text/babel" src="screens-orguser.jsx"></script>
  <script type="text/babel" src="screens-client.jsx"></script>
  <script type="text/babel" src="screens-client-extra.jsx"></script>
  <script type="text/babel" src="screens-system.jsx"></script>

  <!-- App root (last) -->
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
